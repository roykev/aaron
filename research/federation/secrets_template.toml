# Aaron Owl — Streamlit Secrets Template
# ========================================
# Paste the contents of this file (filled in) into:
#   Streamlit dashboard → your app → Settings → Secrets
#
# Do NOT commit this file with real values.
# Run token_manager.py to generate the [tokens.*] blocks automatically.

# ── Email ──────────────────────────────────────────────────────────────────────
# Use a Gmail account with a dedicated App Password (not your regular password).
# Gmail → Manage Account → Security → 2-Step Verification → App Passwords
[email]
sender    = "aaron.owl.noreply@gmail.com"
password  = "xxxx xxxx xxxx xxxx"          # 16-char Gmail app password
recipient = "roy@aaronowl.com"

# ── Tokens (one block per teacher/course) ─────────────────────────────────────
# Generated by: python federation/token_manager.py --course <key> --app-url <url> [--grade-mode ...]
# Each token = the private "secret code" in the URL (…/?token=…).

# [tokens.ceramics_ab12cd34ef56]
# course_name  = "חומרים קרמיים"
# grade_mode   = "full_ab"        # full_ab | single_a | final | pass_fail | components
# pass_mark    = 60
# features_b64 = "<base64 federation CSV (with warmup + cluster_id)>"
# usage_b64    = "<base64 usage_report HTML>"      # optional — embeds the usage report
# meta_b64     = "<base64 course_meta_<key>.json>"  # optional — pre-fills the metadata form
